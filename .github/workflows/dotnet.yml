name: .NET CI and NuGet release

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose benchmark and playground assets must be rebuilt
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: NumeralSystems.Net
        run: dotnet restore NumeralSystems.Net.sln

      - name: Build
        working-directory: NumeralSystems.Net
        run: >-
          dotnet build NumeralSystems.Net.sln
          --configuration Release
          --no-restore
          --warnaserror
          -p:GeneratePackageOnBuild=false

      - name: Test
        working-directory: NumeralSystems.Net
        run: >-
          dotnet test NumeralSystems.Net.sln
          --configuration Release
          --no-build
          --no-restore
          --verbosity normal

      - name: Validate NuGet packages
        working-directory: NumeralSystems.Net
        shell: bash
        run: |
          set -euo pipefail

          for project in \
            NumeralSystems.Net/NumeralSystems.Net.csproj \
            NumeralSystems.Net.Json/NumeralSystems.Net.Json.csproj \
            NumeralSystems.Net.Tool/NumeralSystems.Net.Tool.csproj
          do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --no-restore \
              --output artifacts/validation \
              -p:ContinuousIntegrationBuild=true \
              -p:GeneratePackageOnBuild=false
          done

      - name: Validate WebAssembly publish
        working-directory: NumeralSystems.Net
        run: >-
          dotnet publish NumeralSystems.Net.Playground/NumeralSystems.Net.Playground.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/playground-validation

      - name: Validate interactive documentation assets
        working-directory: NumeralSystems.Net
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/playground-validation/wwwroot/.nojekyll
          test -f artifacts/playground-validation/wwwroot/docs/index.html
          test -f artifacts/playground-validation/wwwroot/js/playground.js

  publish-nuget:
    name: Package and publish to NuGet.org
    if: github.event_name == 'release'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate release tag
        id: package-version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'

          if [[ ! "$version" =~ $version_pattern ]]; then
            echo "::error title=Invalid NuGet release tag::Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore package dependencies
        working-directory: NumeralSystems.Net
        run: dotnet restore NumeralSystems.Net.sln

      - name: Create NuGet packages
        working-directory: NumeralSystems.Net
        shell: bash
        run: |
          set -euo pipefail

          for project in \
            NumeralSystems.Net/NumeralSystems.Net.csproj \
            NumeralSystems.Net.Json/NumeralSystems.Net.Json.csproj \
            NumeralSystems.Net.Tool/NumeralSystems.Net.Tool.csproj
          do
            dotnet pack "$project" \
              --configuration Release \
              --no-restore \
              --output artifacts \
              -p:PackageVersion=${{ steps.package-version.outputs.value }} \
              -p:ContinuousIntegrationBuild=true \
              -p:GeneratePackageOnBuild=false
          done

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: NumeralSystems.Net-packages-${{ steps.package-version.outputs.value }}
          path: |
            NumeralSystems.Net/artifacts/*.nupkg
            NumeralSystems.Net/artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 30

      - name: Authenticate to NuGet.org with OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages to NuGet.org
        shell: bash
        run: |
          set -euo pipefail

          dotnet nuget push NumeralSystems.Net/artifacts/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

  publish-release-assets:
    name: Publish benchmarks and playground
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate target release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$version" =~ $version_pattern ]]; then
            echo "::error title=Invalid release tag::Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease."
            exit 1
          fi

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName

      - name: Restore release projects
        working-directory: NumeralSystems.Net
        run: dotnet restore NumeralSystems.Net.sln

      - name: Run and export benchmarks
        working-directory: NumeralSystems.Net
        run: >-
          dotnet run
          --project NumeralSystems.Net.Benchmarks/NumeralSystems.Net.Benchmarks.csproj
          --configuration Release
          --no-restore
          --
          --job short
          --exporters json
          --artifacts artifacts/benchmarks
          --filter '*'

      - name: Verify benchmark exports
        working-directory: NumeralSystems.Net
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          markdown_reports=(artifacts/benchmarks/results/*-report-github.md)
          json_reports=(artifacts/benchmarks/results/*-report-full-compressed.json)
          if (( ${#markdown_reports[@]} == 0 || ${#json_reports[@]} == 0 )); then
            echo "::error title=Missing benchmark exports::BenchmarkDotNet did not create both GitHub Markdown and JSON reports."
            exit 1
          fi

          echo "Found ${#markdown_reports[@]} Markdown and ${#json_reports[@]} JSON benchmark report(s)."

      - name: Publish WebAssembly playground
        working-directory: NumeralSystems.Net
        run: >-
          dotnet publish NumeralSystems.Net.Playground/NumeralSystems.Net.Playground.csproj
          --configuration Release
          --no-restore
          --output artifacts/playground

      - name: Create release archives
        working-directory: NumeralSystems.Net
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          tar -czf "artifacts/NumeralSystems.Net-benchmarks-$version.tar.gz" \
            -C artifacts/benchmarks .
          cd artifacts/playground/wwwroot
          zip -qr "../../NumeralSystems.Net-playground-$version.zip" .

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v7
        with:
          name: NumeralSystems.Net-release-assets-${{ env.RELEASE_TAG }}
          path: |
            NumeralSystems.Net/artifacts/NumeralSystems.Net-benchmarks-*.tar.gz
            NumeralSystems.Net/artifacts/NumeralSystems.Net-playground-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach assets to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          NumeralSystems.Net/artifacts/NumeralSystems.Net-benchmarks-*.tar.gz
          NumeralSystems.Net/artifacts/NumeralSystems.Net-playground-*.zip
          --clobber

  deploy-pages:
    name: Deploy playground and interactive docs to GitHub Pages
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out deployment source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore playground dependencies
        working-directory: NumeralSystems.Net
        run: dotnet restore NumeralSystems.Net.Playground/NumeralSystems.Net.Playground.csproj

      - name: Publish playground and interactive documentation
        working-directory: NumeralSystems.Net
        run: >-
          dotnet publish NumeralSystems.Net.Playground/NumeralSystems.Net.Playground.csproj
          --configuration Release
          --no-restore
          --output artifacts/pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: NumeralSystems.Net/artifacts/pages/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
